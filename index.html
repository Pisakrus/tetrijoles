<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Leo">
    <meta name="author" content="Dario">
    <link rel="icon" type="webp" href="images/frijoles-logo.webp">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="style.css">
    <title>Tetrijoles</title>
</head>

<body>

<div class="layout">

    <!-- LEFT COLUMN (MENU) -->
    <aside class="left-panel">
        <header id="game-title">
            <h1 class="title">TETRIJOLES</h1>
            <h2>A game of Tetris and Beans</h2>
        </header>

        <img id="frijoles" src="images/frijoles-negros.png" alt="Frijoles">
        <img id="gitano" src="">
    </aside>

    <!-- CENTER COLUMN (GAME) -->
    <main class="center-panel">
            <canvas id="gameCanvas"></canvas>
    </main>

    <!-- RIGHT COLUMN (HUD / UI) -->
    <aside class="right-panel">
            <canvas id="nextPieceCanvas" width="500" height="150"></canvas>
                
        <div id="statsDisplay">
            <div class="hud-item">
            <span>Score</span>
            <span id="scoreDisplay">000000</span>
            </div>

            <div class="hud-item">
                <span>Time</span>
                <span id="timeDisplay">00:00</span>
            </div>
        </div>
    </aside>

</div>

<script src="menu.js"></script>
<script src="gameobject.js"></script>
<script src="input.js"></script>
<script src="logic.js"></script>
<script src="domRender.js"></script>
<script src="canvasRender.js"></script>
<script src="main.js"></script>

</body>
</html>
